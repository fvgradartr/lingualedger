[package]
name = "lingualedger-treasury"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LinguaLedger treasury: on-chain price floor, daily spend cap, payee allowlist, 70/20/10 split, and kill switch."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
